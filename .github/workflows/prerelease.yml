name: Prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/debug/*.apk dist/package.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: provenio-android-debug
          path: dist/package.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build deb package
        run: ./gradlew :composeApp:packageDeb

      - name: Rename deb
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/*.deb dist/package.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: provenio-linux-deb
          path: dist/package.deb

  publish-prerelease:
    needs: [build-android, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease
          name: "Prerelease (latest main)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*.apk
            artifacts/**/*.deb
