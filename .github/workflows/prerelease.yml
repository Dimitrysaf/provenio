name: Prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up environment
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (Android)
        run: |
          ./gradlew :androidApp:assembleDebug
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/package.apk

      - name: Build with Gradle (Desktop)
        run: |
          ./gradlew :composeApp:packageDeb
          cp composeApp/build/compose/binaries/main/deb/*.deb dist/package.deb

      - name: Verify build output
        run: test -f dist/package.apk && test -f dist/package.deb

      - name: Output prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease
          name: "Prerelease (latest main)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            dist/package.apk
            dist/package.deb
