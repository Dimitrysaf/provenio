name: Prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up environment
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runners are ephemeral, so a build with no signing config gets a freshly
      # generated debug key every time and Android refuses to install one build over
      # another. Generating the key once and keeping it in the repo makes every APK
      # signed by the same key, which is what makes updates install.
      - name: Ensure stable signing key
        run: |
          if [ ! -f androidApp/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore androidApp/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Provenio Debug, O=Provenio, C=GR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f androidApp/debug.keystore
            git commit -m "add: stable signing key so updates install [skip ci]"
            git push origin HEAD:main
          fi

      - name: Determine version
        run: |
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=0.0.1-$BUILD" >> "$GITHUB_ENV"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (Android)
        run: |
          ./gradlew :androidApp:assembleDebug \
            -PappVersionCode="$BUILD" -PappVersionName="$VERSION"
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/package.apk

      - name: Build with Gradle (Desktop)
        run: |
          ./gradlew :composeApp:packageDeb
          cp composeApp/build/compose/binaries/main/deb/*.deb dist/package.deb

      - name: Verify build output
        run: test -f dist/package.apk && test -f dist/package.deb

      - name: Output prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Prerelease ${{ env.VERSION }}"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            dist/package.apk
            dist/package.deb
