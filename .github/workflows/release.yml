name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stable:
    name: Build stable
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          local-properties-base64: ${{ secrets.PROVENIO_LOCAL_PROPERTIES_BASE64 }}
          keystore-base64: ${{ secrets.PROVENIO_RELEASE_KEYSTORE_BASE64 }}

      - name: Building app
        uses: ./.github/actions/build-app
        with:
          build-type: release
          artifact-name: provenio-stable

      - name: Building Flatpak
        uses: ./.github/actions/flatpak
        with:
          artifact-name: provenio-stable-linux

      - name: Publish stable app
        run: |
          version="$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Version.xcconfig)"
          previous="$(git rev-list -n 1 stable 2>/dev/null || true)"
          if [[ -n "${previous}" ]]; then
            git log --no-merges --pretty='- %s' "${previous}..HEAD" > notes.md
          else
            git log --no-merges --pretty='- %s' -n 50 > notes.md
          fi
          [[ -s notes.md ]] || echo "- No changes since the last stable release." > notes.md

          if gh release view stable --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 </dev/null; then
            echo "Deleting the previous stable release"
            gh release delete stable --repo "${GITHUB_REPOSITORY}" --yes </dev/null
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/stable" >/dev/null 2>&1 </dev/null; then
            echo "Deleting the previous stable tag"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/stable" </dev/null
          fi
          gh release create stable \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Provenio Stable channel ${version}" \
            --notes-file notes.md \
            --latest \
            dist/*.apk dist/Provenio.flatpak </dev/null
