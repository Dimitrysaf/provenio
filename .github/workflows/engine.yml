name: Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

concurrency:
  group: engine
  cancel-in-progress: true

jobs:
  android:
    name: Build Android engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 4.1.2

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install NDK and CMake
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Building engine
        working-directory: engine/platform/android
        run: ./gradlew :engine:assembleRelease --no-daemon

      - name: Verify engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep > /dev/null
          engine/scripts/verify-android-aar.sh engine/platform/android/engine/build/outputs/aar/engine-release.aar

      - name: Commit engine binaries
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' engine/platform/android/engine/build.gradle.kts)"
          rm -f composeApp/libs/lib-engine-android-*.aar
          cp engine/platform/android/engine/build/outputs/aar/engine-release.aar "composeApp/libs/lib-engine-android-${version}.aar"
          git add -A composeApp/libs
          if git diff --cached --quiet; then
            echo "Engine binaries are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: Update the engine binaries"
          git push origin HEAD:main
          # Pushes from this token do not start workflows, so the app build is started by hand.
          gh workflow run prerelease.yml --ref main
