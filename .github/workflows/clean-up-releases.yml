name: Clean Up Releases

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-up-releases
  cancel-in-progress: false

jobs:
  clean-up:
    name: Keep only the beta and stable releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Delete every other release
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/releases?per_page=100" \
            --jq '.[] | "\(.id) \(.tag_name)"' </dev/null > releases.txt
          echo "Found $(wc -l < releases.txt) releases."
          deleted=0
          while read -r id tag; do
            if [[ "${tag}" == "beta" || "${tag}" == "stable" ]]; then
              echo "Keeping release ${tag}"
              continue
            fi
            if gh api -X DELETE "repos/${REPO}/releases/${id}" </dev/null >/dev/null; then
              echo "Deleted release ${tag} (${id})"
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not delete release ${tag} (${id})"
            fi
          done < releases.txt
          echo "Deleted ${deleted} releases."

      - name: Delete every other tag
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/git/refs/tags?per_page=100" \
            --jq '.[].ref' </dev/null > tags.txt || true
          echo "Found $(wc -l < tags.txt) tags."
          deleted=0
          while read -r ref; do
            tag="${ref#refs/tags/}"
            if [[ "${tag}" == "beta" || "${tag}" == "stable" ]]; then
              echo "Keeping tag ${tag}"
              continue
            fi
            if gh api -X DELETE "repos/${REPO}/git/${ref}" </dev/null >/dev/null; then
              echo "Deleted tag ${tag}"
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not delete tag ${tag}"
            fi
          done < tags.txt
          echo "Deleted ${deleted} tags."
