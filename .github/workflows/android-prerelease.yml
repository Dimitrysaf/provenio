name: Build Android Prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: android-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create placeholder local.properties
        run: touch local.properties

      - name: Build full debug APKs
        # Override the low-priority setting from gradle.properties
        # (runners have nothing else to starve)
        run: ./gradlew :androidApp:assembleFullDebug -Pprovenio.abiSplits=true --stacktrace --no-configuration-cache --priority=normal

      - name: Name the APKs
        run: ./.github/scripts/name-apks.sh androidApp/build/outputs/apk/full/debug dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: provenio-beta-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish the beta channel
        if: github.ref == 'refs/heads/main'
        run: |
          short_sha="${GITHUB_SHA::7}"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message' > beta-notes.md
          ./.github/scripts/replace-channel-release.sh beta "Provenio Beta channel ${short_sha}" beta-notes.md --prerelease
