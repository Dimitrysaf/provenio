name: Build Android Prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - nuvio-migration
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: android-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create placeholder local.properties
        run: touch local.properties

      - name: Build full debug APK
        # Override the low-priority setting from gradle.properties
        # (runners have nothing else to starve)
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace --no-configuration-cache --priority=normal

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-prerelease-android-full-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14