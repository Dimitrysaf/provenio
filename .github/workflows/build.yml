name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to build
        type: choice
        options:
          - beta
          - stable
        default: beta
      rebuild-engine:
        description: Rebuild the engine even if it is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.channel || 'beta' }}
  cancel-in-progress: ${{ inputs.channel != 'stable' }}

jobs:
  engine:
    name: Android engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha || github.sha }}
    env:
      NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 4.1.2
      # Tree hash of engine/ that the committed binary was built from.
      STAMP: composeApp/libs/lib-engine-android.source
      # CMake runs every native compile through ccache.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for engine changes
        id: check
        env:
          FORCE: ${{ inputs.rebuild-engine || false }}
        run: |
          current="$(git rev-parse HEAD:engine)"
          built="$(cat "${STAMP}" 2>/dev/null || true)"
          if [[ "${FORCE}" == "true" || "${current}" != "${built}" ]]; then
            echo "Engine changed (${built:-none} -> ${current})"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Engine is unchanged"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up environment
        if: steps.check.outputs.changed == 'true'
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep ccache > /dev/null

      # Static OpenSSL for every ABI; the build script skips ABIs that are already built.
      - uses: actions/cache@v4
        if: steps.check.outputs.changed == 'true'
        with:
          path: engine/platform/android/.deps
          key: android-openssl-${{ env.NDK_VERSION }}-${{ hashFiles('engine/scripts/build-android-openssl.sh') }}

      - uses: actions/cache@v4
        if: steps.check.outputs.changed == 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - uses: actions/setup-java@v5
        if: steps.check.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.check.outputs.changed == 'true'
        with:
          cache-read-only: false

      - name: Building engine
        if: steps.check.outputs.changed == 'true'
        working-directory: engine/platform/android
        run: |
          ccache --zero-stats
          ./gradlew :engine:assembleRelease --no-daemon
          ccache --show-stats

      - name: Verify engine
        if: steps.check.outputs.changed == 'true'
        run: engine/scripts/verify-android-aar.sh engine/platform/android/engine/build/outputs/aar/engine-release.aar

      # Pushes made with the workflow token do not start another workflow run.
      - name: Commit engine binaries
        id: commit
        if: steps.check.outputs.changed == 'true'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' engine/platform/android/engine/build.gradle.kts)"
          rm -f composeApp/libs/lib-engine-android-*.aar
          cp engine/platform/android/engine/build/outputs/aar/engine-release.aar "composeApp/libs/lib-engine-android-${version}.aar"
          git rev-parse HEAD:engine > "${STAMP}"
          git add -A composeApp/libs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: Update the engine binaries"

          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push the engine binaries" >&2
          exit 1

  app:
    name: App
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.engine.outputs.sha }}

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          local-properties-base64: ${{ secrets.PROVENIO_LOCAL_PROPERTIES_BASE64 }}
          keystore-base64: ${{ inputs.channel == 'stable' && secrets.PROVENIO_RELEASE_KEYSTORE_BASE64 || '' }}
          simkl-client-id: ${{ secrets.SIMKL_CLIENT_ID }}

      - name: Building app
        uses: ./.github/actions/build-app
        with:
          build-type: ${{ inputs.channel == 'stable' && 'release' || 'debug' }}
          gradle-args: ${{ inputs.channel != 'stable' && '-Pprovenio.abiSplits=true --no-configuration-cache' || '' }}
          artifact-name: provenio-${{ inputs.channel || 'beta' }}

  # The engine's JNI library for Linux, rebuilt only when the engine source changes.
  linux-engine:
    name: Linux engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - id: built
        uses: actions/cache@v4
        with:
          path: build/linux/app-resources/linux-x64/libengine.so
          key: linux-engine-${{ runner.arch }}-${{ hashFiles('engine/**', 'scripts/build-linux.sh') }}

      - name: Set up environment
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache > /dev/null

      - uses: actions/setup-java@v5
        if: steps.built.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: build/linux/deps
          key: linux-deps-${{ runner.arch }}-${{ hashFiles('engine/scripts/build-linux-openssl.sh') }}

      - uses: actions/cache@v4
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ runner.arch }}-

      - name: Building engine
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          ccache --zero-stats
          scripts/build-linux.sh --engine-only
          ccache --show-stats

      - uses: actions/upload-artifact@v7
        with:
          name: linux-engine
          path: build/linux/app-resources/linux-x64/libengine.so
          if-no-files-found: error
          retention-days: 1

  flatpak:
    name: Packaging Flatpak
    needs: [engine, linux-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PROVENIO_ENGINE_LIBRARY: ${{ github.workspace }}/build/linux/prebuilt/libengine.so

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.engine.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: linux-engine
          path: build/linux/prebuilt

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          local-properties-base64: ${{ secrets.PROVENIO_LOCAL_PROPERTIES_BASE64 }}
          simkl-client-id: ${{ secrets.SIMKL_CLIENT_ID }}

      - name: Packaging Flatpak
        uses: ./.github/actions/flatpak
        with:
          artifact-name: provenio-${{ inputs.channel || 'beta' }}-linux

  # The engine's JNI library for Windows, cross-built on Linux with the engine's own llvm-mingw toolchain.
  windows-engine:
    name: Windows engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLVM_MINGW_VERSION: '20260407'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - id: built
        uses: actions/cache@v4
        with:
          path: |
            build/windows/engine.dll
            build/windows/provenio.ico
          key: windows-engine-${{ env.LLVM_MINGW_VERSION }}-${{ hashFiles('engine/**', 'scripts/build-windows-engine.sh', 'packaging/linux/io.github.dimitrysaf.Provenio.png') }}

      - uses: actions/setup-java@v5
        if: steps.built.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: engine/platform/windows/.deps
          key: windows-deps-${{ env.LLVM_MINGW_VERSION }}-${{ hashFiles('engine/scripts/prepare-native-dependencies.sh', 'engine/scripts/build-windows-openssl.sh') }}

      - name: Set up environment
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build imagemagick > /dev/null
          curl --fail --location --retry 3 --silent --show-error --output /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf /tmp/llvm-mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw

      - name: Building engine
        if: steps.built.outputs.cache-hit != 'true'
        run: scripts/build-windows-engine.sh

      - uses: actions/upload-artifact@v7
        with:
          name: windows-engine
          path: |
            build/windows/engine.dll
            build/windows/provenio.ico
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Packaging Windows
    needs: [engine, windows-engine]
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.engine.outputs.sha }}

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          local-properties-base64: ${{ secrets.PROVENIO_LOCAL_PROPERTIES_BASE64 }}
          simkl-client-id: ${{ secrets.SIMKL_CLIENT_ID }}

      - uses: actions/download-artifact@v8
        with:
          name: windows-engine
          path: build/windows

      # libmpv for the player, from the mpv Windows builds that ship it as a single DLL.
      - name: Download libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$(gh release view --repo shinchiro/mpv-winbuild-cmake --json assets \
            --jq '[.assets[].name | select(test("^mpv-dev-x86_64-[0-9]{8}-git-[0-9a-f]+\\.7z$"))][0]')"
          [[ -n "${asset}" ]] || { echo "No libmpv build found" >&2; exit 1; }
          echo "Using ${asset}"
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "${asset}" --dir build/windows
          7z x -y -obuild/windows/mpv "build/windows/${asset}" > /dev/null

          resources=build/linux/app-resources/windows-x64
          mkdir -p "${resources}"
          cp build/windows/engine.dll "${resources}/engine.dll"
          cp build/windows/mpv/libmpv-2.dll "${resources}/mpv.dll"

      - name: Packaging Windows
        run: |
          ./gradlew :composeApp:packageReleaseMsi -Pprovenio.engine.fromSource=false --no-configuration-cache --stacktrace
          mkdir -p dist
          msi="$(ls composeApp/build/compose/binaries/main-release/msi/*.msi | head -n 1)"
          cp "${msi}" dist/Provenio.msi

      - uses: actions/upload-artifact@v7
        with:
          name: provenio-${{ inputs.channel || 'beta' }}-windows
          path: dist/Provenio.msi
          if-no-files-found: error
          retention-days: 14

  # Publishes whatever was packaged, as long as at least one of the app, the Flatpak and the MSI made it.
  publish:
    name: Publish
    needs: [engine, app, flatpak, windows]
    if: >-
      always() &&
      needs.engine.result == 'success' &&
      (needs.app.result == 'success' || needs.flatpak.result == 'success' || needs.windows.result == 'success') &&
      (github.ref == 'refs/heads/main' || inputs.channel == 'stable')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ inputs.channel || 'beta' }}
      SHA: ${{ needs.engine.outputs.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.engine.outputs.sha }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: provenio-${{ inputs.channel || 'beta' }}*
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          shopt -s nullglob
          files=(dist/*.apk)
          if (( ${#files[@]} == 0 )); then
            echo "::warning::APKs are missing"
          fi
          if [[ -f dist/Provenio.flatpak ]]; then
            files+=(dist/Provenio.flatpak)
          else
            echo "::warning::Flatpak is missing"
          fi
          if [[ -f dist/Provenio.msi ]]; then
            files+=(dist/Provenio.msi)
          else
            echo "::warning::Windows installer is missing"
          fi

          if [[ "${CHANNEL}" == "stable" ]]; then
            version="$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Version.xcconfig)"
            title="Provenio Stable channel ${version}"
            flag="--latest"
            previous="$(git rev-list -n 1 stable 2>/dev/null || true)"
            if [[ -n "${previous}" ]]; then
              git log --no-merges --pretty='- %s' "${previous}..HEAD" > notes.md
            else
              git log --no-merges --pretty='- %s' -n 50 > notes.md
            fi
            [[ -s notes.md ]] || echo "- No changes since the last stable release." > notes.md
          else
            title="Provenio Beta channel ${SHA::7}"
            flag="--prerelease"
            git log -1 --format=%B "${GITHUB_SHA}" > notes.md
          fi

          if gh release view "${CHANNEL}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 </dev/null; then
            echo "Deleting the previous ${CHANNEL} release"
            gh release delete "${CHANNEL}" --repo "${GITHUB_REPOSITORY}" --yes </dev/null
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CHANNEL}" >/dev/null 2>&1 </dev/null; then
            echo "Deleting the previous ${CHANNEL} tag"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${CHANNEL}" </dev/null
          fi
          gh release create "${CHANNEL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "${title}" \
            --notes-file notes.md \
            "${flag}" \
            "${files[@]}" </dev/null
