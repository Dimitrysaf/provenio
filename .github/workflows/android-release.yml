name: Build Stable Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  stable:
    name: Build and publish the stable channel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.PROVENIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.PROVENIO_RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release properties
        run: |
          keystore_path="${RUNNER_TEMP}/provenio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties

          sed -i -E '/^[[:space:]]*(sdk\.dir|PROVENIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nPROVENIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties

          required_properties=(
            PROVENIO_RELEASE_STORE_PASSWORD
            PROVENIO_RELEASE_KEY_ALIAS
            PROVENIO_RELEASE_KEY_PASSWORD
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Build full release APKs
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Name the APKs
        run: |
          mkdir -p dist
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            case "$(basename "${apk}")" in
              *-universal-*) name="Provenio.apk" ;;
              *-arm64-v8a-*) name="Provenio-arm64v8.apk" ;;
              *-armeabi-v7a-*) name="Provenio-armv7.apk" ;;
              *-x86_64-*) name="Provenio-x86_64.apk" ;;
              *-x86-*) name="Provenio-x86.apk" ;;
              *) continue ;;
            esac
            cp "${apk}" "dist/${name}"
          done
          if [[ ! -f dist/Provenio.apk ]]; then
            echo "No universal APK was built." >&2
            exit 1
          fi
          ls -l dist

      - name: Write the changelog
        run: |
          previous="$(git rev-list -n 1 stable 2>/dev/null || true)"
          if [[ -n "${previous}" ]]; then
            git log --no-merges --pretty='- %s' "${previous}..HEAD" > changelog.md
          else
            git log --no-merges --pretty='- %s' -n 50 > changelog.md
          fi
          [[ -s changelog.md ]] || echo "- No changes since the last stable release." > changelog.md

      - name: Publish the stable channel
        run: |
          version="$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Version.xcconfig)"
          if gh release view stable --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 </dev/null; then
            echo "Deleting the previous stable release"
            gh release delete stable --repo "${GITHUB_REPOSITORY}" --yes </dev/null
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/stable" >/dev/null 2>&1 </dev/null; then
            echo "Deleting the previous stable tag"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/stable" </dev/null
          fi
          gh release create stable \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Provenio Stable channel ${version}" \
            --notes-file changelog.md \
            --latest \
            dist/*.apk </dev/null
