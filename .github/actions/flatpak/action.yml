name: Build Flatpak
description: Builds the Linux desktop app as dist/Provenio.flatpak and uploads it as an artifact.

inputs:
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  repo-url:
    description: Flatpak repository the installed bundle updates from
    required: false
    default: ''
  gpg-key:
    description: Armored private key that signs the Flatpak repository
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq flatpak flatpak-builder ninja-build ccache > /dev/null

    # flatpak-builder's per-module cache: libass, libplacebo, FFmpeg and mpv only rebuild when the
    # manifest changes.
    - uses: actions/cache@v4
      with:
        path: build/linux/flatpak-state
        key: flatpak-${{ runner.arch }}-${{ hashFiles('packaging/linux/io.github.dimitrysaf.Provenio.yml') }}-${{ github.sha }}
        restore-keys: |
          flatpak-${{ runner.arch }}-${{ hashFiles('packaging/linux/io.github.dimitrysaf.Provenio.yml') }}-
          flatpak-${{ runner.arch }}-

    # Flathub runtimes and SDKs that flatpak-builder installs for the manifest.
    - uses: actions/cache@v4
      with:
        path: ~/.local/share/flatpak
        key: flatpak-runtimes-${{ runner.arch }}-${{ hashFiles('packaging/linux/io.github.dimitrysaf.Provenio.yml') }}
        restore-keys: flatpak-runtimes-${{ runner.arch }}-

    # The engine library comes prebuilt from the Linux engine job, through PROVENIO_ENGINE_LIBRARY.
    - shell: bash
      env:
        REPO_URL: ${{ inputs.repo-url }}
        GPG_KEY: ${{ inputs.gpg-key }}
      run: |
        if [[ -n "${REPO_URL}" && -n "${GPG_KEY}" ]]; then
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import <<< "${GPG_KEY}"
          export PROVENIO_FLATPAK_GPG_PUBLIC_KEY="${RUNNER_TEMP}/provenio-flatpak.gpg"
          gpg --batch --export > "${PROVENIO_FLATPAK_GPG_PUBLIC_KEY}"
          export PROVENIO_FLATPAK_REPO_URL="${REPO_URL}"
        else
          echo "::warning::FLATPAK_GPG_KEY is not set, so the bundle will not update from the Flatpak repository"
        fi
        scripts/build-linux.sh

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/Provenio.flatpak
        if-no-files-found: error
        retention-days: 14
