name: Build Flatpak
description: Builds the Linux desktop app as dist/Provenio.flatpak and uploads it as an artifact.

inputs:
  artifact-name:
    description: Name of the uploaded artifact
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq flatpak flatpak-builder ninja-build ccache > /dev/null

    # flatpak-builder's per-module cache: libass, libplacebo, FFmpeg and mpv only rebuild when the
    # manifest changes.
    - uses: actions/cache@v4
      with:
        path: build/linux/flatpak-state
        key: flatpak-${{ runner.arch }}-${{ hashFiles('packaging/linux/io.github.dimitrysaf.Provenio.yml') }}-${{ github.sha }}
        restore-keys: |
          flatpak-${{ runner.arch }}-${{ hashFiles('packaging/linux/io.github.dimitrysaf.Provenio.yml') }}-
          flatpak-${{ runner.arch }}-

    - uses: actions/cache@v4
      with:
        path: build/linux/deps
        key: linux-deps-${{ runner.arch }}-${{ hashFiles('engine/scripts/build-linux-openssl.sh') }}

    # Flathub runtimes and SDKs that flatpak-builder installs for the manifest.
    - uses: actions/cache@v4
      with:
        path: ~/.local/share/flatpak
        key: flatpak-runtimes-${{ runner.arch }}-${{ hashFiles('packaging/linux/io.github.dimitrysaf.Provenio.yml') }}
        restore-keys: flatpak-runtimes-${{ runner.arch }}-

    # Compiler cache for the engine JNI library.
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-linux-${{ runner.arch }}-${{ github.sha }}
        restore-keys: ccache-linux-${{ runner.arch }}-

    - shell: bash
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: 'true'
        CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
        CCACHE_MAXSIZE: 1G
      run: |
        ccache --zero-stats
        scripts/build-linux.sh
        ccache --show-stats

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/Provenio.flatpak
        if-no-files-found: error
        retention-days: 14
